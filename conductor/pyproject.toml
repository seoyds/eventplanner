[project]
name = "conductor"
version = "0.1.0"
description = "Conductor service - orchestrates specialist agents"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "claude-agent-sdk",
    "ag-ui-protocol",
    "fastapi",
    "uvicorn",
    "httpx",
]

[tool.uv.sources]
shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
