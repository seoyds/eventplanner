services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db

  nanda-registry:
    build: ./nanda-registry
    ports: ["6900:6900"]
    environment:
      - MONGODB_URI=mongodb://mongo:27017/nanda
      - PORT=6900
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6900/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  conductor:
    build:
      context: .
      dockerfile: conductor/Dockerfile
    ports: ["8000:8000"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NANDA_REGISTRY_URL=http://nanda-registry:6900
    depends_on:
      nanda-registry:
        condition: service_healthy

  venue:
    build:
      context: .
      dockerfile: agents/venue/Dockerfile
    ports: ["8001:8001"]
    environment: &agent-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NANDA_REGISTRY_URL: http://nanda-registry:6900
    depends_on:
      nanda-registry:
        condition: service_healthy

  weather:
    build:
      context: .
      dockerfile: agents/weather/Dockerfile
    ports: ["8002:8002"]
    environment: *agent-env
    depends_on:
      nanda-registry:
        condition: service_healthy

  budget:
    build:
      context: .
      dockerfile: agents/budget/Dockerfile
    ports: ["8003:8003"]
    environment: *agent-env
    depends_on:
      nanda-registry:
        condition: service_healthy

  menu:
    build:
      context: .
      dockerfile: agents/menu/Dockerfile
    ports: ["8004:8004"]
    environment: *agent-env
    depends_on:
      nanda-registry:
        condition: service_healthy

  activity:
    build:
      context: .
      dockerfile: agents/activity/Dockerfile
    ports: ["8005:8005"]
    environment: *agent-env
    depends_on:
      nanda-registry:
        condition: service_healthy

  accessibility:
    build:
      context: .
      dockerfile: agents/accessibility/Dockerfile
    ports: ["8006:8006"]
    environment: *agent-env
    depends_on:
      nanda-registry:
        condition: service_healthy

  theme:
    build:
      context: .
      dockerfile: agents/theme/Dockerfile
    ports: ["8007:8007"]
    environment: *agent-env
    depends_on:
      nanda-registry:
        condition: service_healthy

  logistics:
    build:
      context: .
      dockerfile: agents/logistics/Dockerfile
    ports: ["8008:8008"]
    environment: *agent-env
    depends_on:
      nanda-registry:
        condition: service_healthy

  communication:
    build:
      context: .
      dockerfile: agents/communication/Dockerfile
    ports: ["8009:8009"]
    environment: *agent-env
    depends_on:
      nanda-registry:
        condition: service_healthy

  supplies:
    build:
      context: .
      dockerfile: agents/supplies/Dockerfile
    ports: ["8110:8010"]
    environment: *agent-env
    depends_on:
      nanda-registry:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_CONDUCTOR_URL=http://conductor:8000/ag-ui
    depends_on:
      - conductor

volumes:
  mongo-data:
