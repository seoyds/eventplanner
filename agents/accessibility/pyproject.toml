[project]
name = "accessibility-agent"
version = "0.1.0"
description = "Accessibility Checker agent"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "claude-agent-sdk",
    "fastapi",
    "uvicorn",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
