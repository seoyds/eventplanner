[project]
name = "weather-agent"
version = "0.1.0"
description = "Weather Analyst agent"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "claude-agent-sdk",
    "fastapi",
    "uvicorn",
    "httpx",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
