[project]
name = "shared"
version = "0.1.0"
description = "Shared schemas and base classes for event orchestrator"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    # "claude-agent-sdk",  # Not yet available on PyPI
    # "a2a-sdk",           # Not yet available on PyPI
    "fastapi",
    "uvicorn",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
