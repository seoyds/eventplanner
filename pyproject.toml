[project]
name = "event-orchestrator"
version = "0.1.0"
description = "Multi-agent event planning system"
requires-python = ">=3.12"
dependencies = [
    "shared",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv.sources]
shared = { workspace = true }

[tool.uv.workspace]
members = ["shared", "conductor", "agents/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
